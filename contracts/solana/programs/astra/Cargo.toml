[package]
name = "astra"
version = "0.1.0"
description = "Astra Loss Protection Protocol on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "astra"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
pyth-sdk-solana = "0.10.3"
solana-program = "1.18.26"
